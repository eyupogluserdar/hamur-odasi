<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hamur Odası</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#121212">
</head>

<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 id="page-title">Hamur Odası</h1>
                <div class="header-actions">
                    <button class="icon-btn" id="theme-toggle"><ion-icon name="moon-outline"></ion-icon></button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-view" class="main-view">
            <div class="empty-state">
                <ion-icon name="restaurant-outline"></ion-icon>
                <p>Yükleniyor...</p>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" data-target="showcase">
                <ion-icon name="grid-outline"></ion-icon>
                <span>Vitrin</span>
            </a>
            <a href="#" class="nav-item" data-target="process">
                <ion-icon name="timer-outline"></ion-icon>
                <span>Üretim</span>
            </a>
            <div class="nav-item-fab-wrapper">
                <button class="fab-btn" id="add-recipe-btn">
                    <ion-icon name="add-outline"></ion-icon>
                </button>
            </div>
            <a href="#" class="nav-item" data-target="inventory">
                <ion-icon name="bag-handle-outline"></ion-icon>
                <span>Malzeme</span>
            </a>
            <a href="#" class="nav-item" data-target="recipes">
                <ion-icon name="book-outline"></ion-icon>
                <span>Reçete</span>
            </a>
        </nav>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Generic Confirmation Modal -->
    <div class="modal-overlay" id="modal-confirm" style="z-index: 2100;">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div style="margin-bottom: 20px;">
                <ion-icon name="alert-circle-outline" style="font-size: 3rem; color: var(--color-primary);"></ion-icon>
            </div>
            <h3 id="confirm-title" style="margin-bottom: 10px;">Onaylıyor musun?</h3>
            <p id="confirm-message" style="color: var(--color-text-secondary); margin-bottom: 25px; line-height: 1.5;">
                İşlem yapılacak.</p>

            <div style="display: flex; gap: 10px;">
                <button class="btn" id="btn-confirm-cancel"
                    style="background: rgba(255,255,255,0.1); color: var(--color-text-primary);">Vazgeç</button>
                <button class="btn btn-primary" id="btn-confirm-ok">Evet, Onayla</button>
            </div>
        </div>
    </div>

    <!-- Initialization of global App namespace -->
    <script>window.App = window.App || {};</script>

    <!-- Scripts (Order Matters!) -->
    <script src="utils.js"></script>
    <script src="storage.js"></script>
    <script src="inventory.js"></script>
    <script src="engine.js"></script>
    <script src="recipes.js"></script>
    <script src="production.js"></script>
    <script src="process.js"></script>
    <script src="showcase.js"></script>
    <script src="app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js")
                .then(() => console.log("Service Worker registered"))
                .catch(err => console.error("Service Worker registration failed", err));
        }
    </script>
</body>

</html>
